<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 câu trắc nghiệm Sinh học 12</title>
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#18264b;--muted:#65718d;--blue:#3456c7;--line:#dce4fb;--green:#147d52;--red:#b4233d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:820px;margin:auto;padding:20px 15px 40px}
header{text-align:center;background:linear-gradient(135deg,#263d8d,#5476e8);color:white;border-radius:22px;padding:22px 16px;margin-bottom:16px}
h1{font-size:clamp(23px,5vw,34px);margin:0 0 7px}
header p{margin:0;opacity:.93;line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
select,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card);color:var(--ink)}
select{flex:1;min-width:160px}
button{cursor:pointer}
button:active{transform:scale(.98)}
.primary{background:var(--blue);color:white;border-color:var(--blue)}
.progressbox,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:9px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
.badge{display:inline-block;background:#e9edff;color:#2c46a3;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}
.question{font-size:20px;line-height:1.55;font-weight:700;margin:16px 0}
.options{display:grid;gap:10px}
.opt{text-align:left;line-height:1.45;display:flex;gap:10px;align-items:flex-start;padding:13px}
.letter{font-weight:800;min-width:22px}
.opt.correct{border-color:#5ab995;background:#e9fbf3}
.opt.wrong{border-color:#e18a9a;background:#fff0f2}
.feedback{border-radius:12px;padding:12px 14px;margin-top:13px;line-height:1.5}
.feedback.good{background:#e7f8ef;color:#116342}
.feedback.bad{background:#fff0f2;color:#9d2038}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:14px}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow button{padding:17px;font-weight:700}
.small{font-size:13px;color:var(--muted);line-height:1.5}
@media(max-width:480px){.app{padding:12px}.question{font-size:18px}.panel{padding:13px}.actions{flex-direction:column}.actions div button{flex:1}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🧬 100 CÂU TRẮC NGHIỆM SINH 12</h1>
<p>Kết nối tri thức · Bài 1, 2, 3, 4 và 7<br>80 câu chọn A/B/C/D + 20 câu Đúng/Sai</p>
</header>
<div class="toolbar">
<select id="filter" aria-label="Lọc bài"><option value="all">📚 Tất cả các bài</option></select>
<button id="shuffle">🔀 Trộn câu</button>
<button id="restart">↻ Làm lại</button>
</div>
<div class="progressbox">
<div class="meta"><span id="count">Câu 1/100</span><span id="score">Đúng: 0 · Sai: 0</span></div>
<div class="track"><div class="bar" id="bar"></div></div>
</div>
<main class="panel">
<span class="badge" id="type">TRẮC NGHIỆM</span>
<div class="small" id="section" style="margin-top:8px"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div id="feedback" class="feedback" hidden></div>
<div class="actions">
<div><button id="prev">← Câu trước</button><button id="next" class="primary">Câu tiếp →</button></div>
<div><button id="skip">Bỏ qua</button></div>
</div>
</main>
<p class="small">💡 Chọn đáp án để xem đúng/sai ngay lập tức. Với câu Đúng/Sai, hãy chọn một trong hai nút. Điểm được tính theo số câu đã trả lời đúng.</p>
</div>

hế nào — n.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Tế bào sinh dưỡng của người bình thường có bao nhiêu nhiễm sắc thể — DNA và protein, chủ yếu là histone.", "correct": false, "explain": "Sai. Đáp án đúng: Tế bào sinh dưỡng của người bình thường có bao nhiêu nhiễm sắc thể — 46 nhiễm sắc thể, tức 23 cặp.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Giao tử người bình thường có bao nhiêu nhiễm sắc thể — 23 nhiễm sắc thể.", "correct": true, "explain": "Đúng. Giao tử người bình thường có bao nhiêu nhiễm sắc thể — 23 nhiễm sắc thể.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Nhiễm sắc thể tương đồng là gì — Đơn vị cơ bản của chromatin, gồm DNA quấn quanh lõi protein histone.", "correct": false, "explain": "Sai. Đáp án đúng: Nhiễm sắc thể tương đồng là gì — Một cặp gồm một chiếc có nguồn gốc từ bố và một từ mẹ, mang các gene tương ứng ở cùng locus.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Nhiễm sắc thể thường khác nhiễm sắc thể giới tính thế nào — Nhiễm sắc thể thường không trực tiếp quyết định giới tính; nhiễm sắc thể giới tính tham gia xác định giới tính theo hệ của loài.", "correct": true, "explain": "Đúng. Nhiễm sắc thể thường khác nhiễm sắc thể giới tính thế nào — Nhiễm sắc thể thường không trực tiếp quyết định giới tính; nhiễm sắc thể giới tính tham gia xác định giới tính theo hệ của loài.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Đột biến cấu trúc nhiễm sắc thể gồm những dạng nào — Lệch bội và đa bội.", "correct": false, "explain": "Sai. Đáp án đúng: Đột biến cấu trúc nhiễm sắc thể gồm những dạng nào — Mất đoạn, lặp đoạn, đảo đoạn và chuyển đoạn.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Đột biến số lượng nhiễm sắc thể gồm những dạng nào — Lệch bội và đa bội.", "correct": true, "explain": "Đúng. Đột biến số lượng nhiễm sắc thể gồm những dạng nào — Lệch bội và đa bội.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"type": "tf", "q": "Vì sao đột biến nhiễm sắc thể có thể gây hậu quả lớn — Lệch bội và đa bội.", "correct": false, "explain": "Sai. Đáp án đúng: Vì sao đột biến nhiễm sắc thể có thể gây hậu quả lớn — Có thể làm thay đổi nhiều gene hoặc liều lượng gene cùng lúc.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}];
let questions = [...allQuestions], pos = 0;
const answers = new Map();
const $ = id => document.getElementById(id);
const sections = [...new Set(allQuestions.map(q => q.section))];
sections.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; $('filter').appendChild(o); });
function counts(){
 let right=0, wrong=0;
 for(const [i,a] of answers){ if(a===questions[i]?.correct) right++; else wrong++; }
 // Score is recalculated for the active question list.
 right=0; wrong=0;
 questions.forEach((q,i)=>{if(answers.has(i)){if(answers.get(i)===q.correct)right++;else wrong++;}});
 return {right,wrong};
}
function render(){
 const q=questions[pos]; if(!q)return;
 $('count').textContent=`Câu ${pos+1}/${questions.length}`;
 $('type').textContent=q.type==='mcq'?'CHỌN 1 ĐÁP ÁN A/B/C/D':'ĐÚNG HAY SAI';
 $('section').textContent=q.section;
 $('question').textContent=q.q;
 $('bar').style.width=((pos+1)/questions.length*100)+'%';
 $('options').innerHTML='';
 $('feedback').hidden=true;
 if(q.type==='mcq'){
   q.options.forEach((op,i)=>{
     const b=document.createElement('button'); b.className='opt';
     const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i]+'.';
     const txt=document.createElement('span');txt.textContent=op;b.append(letter,txt);
     b.onclick=()=>choose(i);$('options').appendChild(b);
   });
 } else {
   const row=document.createElement('div');row.className='tfrow';
   [[true,'✅ ĐÚNG'],[false,'❌ SAI']].forEach(([v,t])=>{
     const b=document.createElement('button');b.textContent=t;b.onclick=()=>choose(v);row.appendChild(b);
   });
   $('options').appendChild(row);
 }
 if(answers.has(pos)) showFeedback(answers.get(pos));
 updateScore();
}
function choose(value){answers.set(pos,value);showFeedback(value);updateScore();}
function showFeedback(value){
 const q=questions[pos], correct=value===q.correct;
 $('feedback').hidden=false;$('feedback').className='feedback '+(correct?'good':'bad');
 $('feedback').textContent=(correct?'🎉 Chính xác! ':'Chưa đúng rồi. ')+q.explain;
 [...$('options').querySelectorAll('button')].forEach((b,i)=>{
   if(q.type==='mcq'){if(i===q.correct)b.classList.add('correct');if(i===value&&value!==q.correct)b.classList.add('wrong');}
 });
}
function updateScore(){const c=counts();$('score').textContent=`Đúng: ${c.right} · Sai: ${c.wrong}`;}
function move(n){pos=(pos+n+questions.length)%questions.length;render();}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('skip').onclick=()=>move(1);
$('filter').onchange=()=>{const v=$('filter').value;questions=v==='all'?[...allQuestions]:allQuestions.filter(q=>q.section===v);pos=0;answers.clear();render();};
$('shuffle').onclick=()=>{questions=[...questions];for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}pos=0;answers.clear();render();};
$('restart').onclick=()=>{const v=$('filter').value;questions=v==='all'?[...allQuestions]:allQuestions.filter(q=>q.section===v);pos=0;answers.clear();render();};
render();
</script>
