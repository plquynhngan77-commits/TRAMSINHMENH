const cards = [
{t:'Bài 1 · DNA và tái bản DNA',q:'Đơn phân cấu tạo nên phân tử DNA là gì?',type:'mc',o:['Amino acid','Nucleotide','Glucose','Glycerol'],a:1,e:'DNA là đại phân tử được cấu tạo từ các nucleotide; mỗi nucleotide gồm đường deoxyribose, phosphate và base nitơ.'},
{t:'Bài 1 · DNA và tái bản DNA',q:'Trong DNA mạch kép, nguyên tắc bổ sung được thể hiện như thế nào?',type:'mc',o:['A liên kết với G, T liên kết với C','A liên kết với C, G liên kết với T','A liên kết với T, G liên kết với C','A liên kết với U, G liên kết với C'],a:2,e:'A bắt cặp với T, còn G bắt cặp với C.'},
{t:'Bài 1 · DNA và tái bản DNA',q:'Một phân tử DNA có 2.000 nucleotide, A chiếm 20%. Số nucleotide G là bao nhiêu?',type:'mc',o:['400','600','800','1.200'],a:1,e:'A = T = 20% × 2.000 = 400. G + C = 60% × 2.000 = 1.200 nên G = C = 600.'},
{t:'Bài 1 · DNA và tái bản DNA',q:'Tái bản DNA được gọi là bán bảo toàn vì…',type:'mc',o:['Hai DNA con chỉ chứa mạch mới','Hai DNA con chỉ chứa mạch cũ','Mỗi DNA con gồm một mạch cũ và một mạch mới','Mỗi DNA con chỉ chứa một nửa thông tin'],a:2,e:'Mỗi phân tử DNA con giữ lại một mạch của DNA mẹ và tổng hợp một mạch mới.'},
{t:'Bài 1 · DNA và tái bản DNA',q:'Một phân tử DNA tái bản liên tiếp 3 lần tạo ra bao nhiêu phân tử DNA?',type:'mc',o:['3','6','8','16'],a:2,e:'Số DNA con = 2ⁿ = 2³ = 8.'},
{t:'Bài 2 · Gene và thông tin di truyền',q:'Gene là gì?',type:'mc',o:['Đoạn DNA mang thông tin mã hóa sản phẩm xác định là RNA hoặc chuỗi polypeptide','Một phân tử protein có khả năng di truyền','Nucleotide chỉ có trong tế bào chất','Bào quan tổng hợp protein'],a:0,e:'Gene là một đoạn của phân tử DNA mang thông tin mã hóa sản phẩm xác định.'},
{t:'Bài 2 · Gene và thông tin di truyền',q:'Quá trình tổng hợp RNA dựa trên mạch khuôn DNA gọi là gì?',type:'mc',o:['Tái bản','Phiên mã','Dịch mã','Nguyên phân'],a:1,e:'Phiên mã sử dụng mạch khuôn DNA để tổng hợp RNA.'},
{t:'Bài 2 · Gene và thông tin di truyền',q:'Phân tử nào trực tiếp mang amino acid đến ribosome khi dịch mã?',type:'mc',o:['DNA','mRNA','tRNA','rRNA'],a:2,e:'tRNA vận chuyển amino acid tương ứng đến ribosome.'},
{t:'Bài 2 · Gene và thông tin di truyền',q:'Mạch khuôn DNA: 3′–TAC GGA CTT–5′. mRNA được tổng hợp là…',type:'mc',o:['5′–AUG CCU GAA–3′','5′–TAC GGA CTT–3′','3′–AUG CCU GAA–5′','5′–ATG CCT GAA–3′'],a:0,e:'mRNA bổ sung với mạch khuôn và được tổng hợp theo chiều 5′ → 3′; RNA dùng U thay cho T.'},
{t:'Bài 2 · Gene và thông tin di truyền',q:'Trình tự truyền đạt thông tin phổ biến từ gene mã hóa protein đến protein là…',type:'mc',o:['Protein → DNA → RNA','RNA → protein → DNA','DNA → RNA → protein','DNA → protein → RNA'],a:2,e:'Thông tin di truyền thường được truyền đạt theo chiều DNA → RNA → protein.'},
{t:'Bài 3 · Điều hòa biểu hiện gene',q:'Điều hòa biểu hiện gene là quá trình…',type:'mc',o:['Làm thay đổi số lượng nhiễm sắc thể','Điều chỉnh mức độ hoạt động của gene và lượng sản phẩm','Luôn thay đổi trình tự nucleotide','Ngăn mọi gene hoạt động'],a:1,e:'Điều hòa giúp kiểm soát thời điểm và mức độ tạo sản phẩm của gene.'},
{t:'Bài 3 · Điều hòa biểu hiện gene',q:'Trong operon lac khi không có lactose, protein ức chế thường…',type:'mc',o:['Gắn vào vùng vận hành, cản trở phiên mã','Phá hủy DNA','Kích thích phiên mã ở mức cao','Gắn amino acid vào ribosome'],a:0,e:'Protein ức chế gắn vùng vận hành làm cản trở hoạt động phiên mã các gene cấu trúc.'},
{t:'Bài 3 · Điều hòa biểu hiện gene',q:'Khi có lactose, điều gì xảy ra trong mô hình operon lac?',type:'mc',o:['Gene cấu trúc biến mất','DNA ngừng tái bản vĩnh viễn','Chất cảm ứng tương tác với protein ức chế, làm giảm khả năng ức chế','Ribosome bị phá hủy'],a:2,e:'Chất cảm ứng allolactose (dẫn xuất của lactose) gắn protein ức chế, khiến protein này không còn gắn vùng vận hành như trước.'},
{t:'Bài 3 · Điều hòa biểu hiện gene',q:'Ý nghĩa quan trọng của điều hòa biểu hiện gene là…',type:'mc',o:['Mọi protein được tạo ra với lượng bằng nhau','Sử dụng năng lượng và nguyên liệu hợp lý, thích nghi với môi trường','Mọi tế bào có hình dạng giống nhau','Làm mọi đột biến biến mất'],a:1,e:'Tế bào chỉ biểu hiện gene cần thiết ở thời điểm và mức độ phù hợp.'},
{t:'Bài 4 · Đột biến gene',q:'Đột biến gene là…',type:'mc',o:['Thay đổi số lượng tế bào','Thay đổi hình dạng cơ quan do luyện tập','Biến đổi trong cấu trúc gene liên quan đến một hoặc một số cặp nucleotide','Thay đổi vị trí ribosome'],a:2,e:'Đột biến gene là biến đổi trong cấu trúc của gene, thường liên quan đến một hoặc một số cặp nucleotide.'},
{t:'Bài 4 · Đột biến gene',q:'Dạng đột biến điểm nào làm tăng một cặp nucleotide trong gene?',type:'mc',o:['Mất một cặp','Thêm một cặp','Thay thế một cặp bằng cặp khác','Không biến đổi'],a:1,e:'Đột biến thêm làm tăng số cặp nucleotide của gene.'},
{t:'Bài 4 · Đột biến gene',q:'Đột biến gene có thể phát sinh do…',type:'mc',o:['Sai sót khi tái bản DNA hoặc tác nhân gây đột biến','Chỉ do nhiệt độ cơ thể','Chỉ do dịch mã','Chỉ do phân chia tế bào chất'],a:0,e:'Sai sót tái bản và các tác nhân vật lí, hóa học hoặc sinh học có thể gây đột biến.'},
{t:'Bài 4 · Đột biến gene',q:'Thêm một cặp nucleotide trong vùng mã hóa có thể…',type:'mc',o:['Luôn tạo protein tốt hơn','Chỉ đổi một amino acid trong mọi trường hợp','Không thể ảnh hưởng sản phẩm gene','Làm thay đổi khung đọc và nhiều amino acid phía sau'],a:3,e:'Thêm hoặc mất số nucleotide không chia hết cho 3 thường làm dịch khung đọc mã di truyền.'},
{t:'Bài 4 · Đột biến gene',q:'Phát biểu nào đúng về đột biến gene?',type:'mc',o:['Mọi đột biến đều có hại','Không có vai trò trong tiến hóa','Có thể có lợi, có hại hoặc trung tính tùy trường hợp','Mọi đột biến đều biểu hiện ngay thành kiểu hình'],a:2,e:'Ảnh hưởng của đột biến phụ thuộc vị trí, kiểu đột biến và môi trường.'},
{t:'Bài 7 · Nhiễm sắc thể',q:'Thành phần chủ yếu cấu tạo nhiễm sắc thể ở sinh vật nhân thực là…',type:'mc',o:['DNA và protein histone','RNA và lipid','Cellulose và protein','Glucose và DNA'],a:0,e:'Nhiễm sắc thể nhân thực gồm DNA liên kết với protein, chủ yếu là histone.'},
{t:'Bài 7 · Nhiễm sắc thể',q:'Đơn vị cấu trúc cơ bản của chromatin là…',type:'mc',o:['Ribosome','Nucleosome','Lysosome','Trung thể'],a:1,e:'Nucleosome gồm DNA quấn quanh lõi protein histone.'},
{t:'Bài 7 · Nhiễm sắc thể',q:'Một nhiễm sắc thể kép ở kì giữa nguyên phân thường gồm…',type:'mc',o:['Một chromatid','Hai NST tương đồng','Hai chromatid chị em gắn nhau ở tâm động','Bốn chromatid không liên quan'],a:2,e:'NST kép gồm hai chromatid chị em liên kết tại vùng tâm động.'},
{t:'Bài 7 · Nhiễm sắc thể',q:'Chức năng quan trọng của nhiễm sắc thể là…',type:'mc',o:['Phân giải toàn bộ chất dinh dưỡng','Tổng hợp ATP trong mọi tế bào','Vận chuyển oxygen trong máu','Lưu giữ, bảo quản và truyền đạt thông tin di truyền'],a:3,e:'Nhiễm sắc thể giúp đóng gói DNA và bảo đảm thông tin di truyền được truyền qua các thế hệ tế bào.'},
{t:'Bài 7 · Nhiễm sắc thể',q:'Loài có 2n = 24. Một tế bào sinh dưỡng bình thường ở kì giữa nguyên phân có…',type:'mc',o:['12 NST kép','24 NST kép','24 NST đơn','48 NST đơn'],a:1,e:'Ở kì giữa nguyên phân, tế bào có 2n = 24 NST kép.'},
{t:'Bài 1 · Đúng/Sai',q:'Xác định Đúng hoặc Sai cho từng phát biểu.',type:'tf',s:['Trong DNA mạch kép, số nucleotide A bằng số nucleotide T.','Hai mạch DNA liên kết với nhau chủ yếu bằng liên kết peptide.','Mỗi mạch DNA ban đầu làm khuôn tổng hợp một mạch mới bổ sung.','Một DNA tái bản liên tiếp 2 lần tạo ra 4 DNA con.'],a:[true,false,true,true],e:'A = T và G = C trong DNA mạch kép; hai mạch liên kết bằng liên kết hydrogen, không phải peptide. Tái bản bán bảo toàn; sau 2 lần có 2² = 4 DNA.'},
{t:'Bài 2 · Đúng/Sai',q:'Xác định Đúng hoặc Sai cho từng phát biểu.',type:'tf',s:['RNA polymerase dùng mạch DNA làm khuôn để tổng hợp RNA.','Ribosome đọc codon trên mRNA theo chiều 3′ → 5′.','AUG thường là codon mở đầu và mã hóa methionine.','Mọi gene trong hệ gene đều mã hóa protein.'],a:[true,false,true,false],e:'Ribosome đọc mRNA theo chiều 5′ → 3′. Không phải mọi gene đều mã hóa protein; một số gene tạo ra các loại RNA chức năng.'},
{t:'Bài 3–4 · Đúng/Sai',q:'Xác định Đúng hoặc Sai cho từng phát biểu.',type:'tf',s:['Điều hòa biểu hiện gene giúp tế bào kiểm soát lượng sản phẩm gene.','Khi không có lactose, protein ức chế của operon lac không thể gắn vùng vận hành.','Mọi đột biến gene đều làm thay đổi kiểu hình.','Đột biến gene có thể tạo allele mới và cung cấp nguyên liệu cho tiến hóa.'],a:[true,false,false,true],e:'Khi không có lactose, protein ức chế có thể gắn vùng vận hành. Đột biến không phải lúc nào cũng biểu hiện ra kiểu hình; chúng có thể trung tính.'},
{t:'Bài 7 · Đúng/Sai',q:'Xác định Đúng hoặc Sai cho từng phát biểu.',type:'tf',s:['DNA ở nhiễm sắc thể nhân thực liên kết với histone tạo chromatin.','Hai chromatid chị em thường mang thông tin di truyền gần như giống nhau nếu không có biến đổi.','Nhiễm sắc thể chỉ lưu giữ, không tham gia truyền đạt thông tin di truyền.','Biến đổi cấu trúc nhiễm sắc thể có thể ảnh hưởng đến sinh vật.'],a:[true,true,false,true],e:'Nhiễm sắc thể vừa lưu giữ vừa truyền đạt thông tin di truyền; biến đổi cấu trúc có thể ảnh hưởng đến sức sống và phát triển.'},
{t:'Bài 1 · Trả lời ngắn',q:'DNA mạch kép có 3.000 nucleotide, A chiếm 20%. Có bao nhiêu nucleotide G?',type:'short',a:['600'],e:'A = T = 600. Còn G + C = 3.000 − 1.200 = 1.800, nên G = 900. Lưu ý: đáp án đúng là 900.',fix:true},
{t:'Bài 1 · Trả lời ngắn',q:'DNA dài 0,51 µm. Khoảng cách giữa hai cặp nucleotide liên tiếp là 0,34 nm. DNA có bao nhiêu cặp nucleotide?',type:'short',a:['1500','1.500'],e:'0,51 µm = 510 nm. Số cặp = 510 ÷ 0,34 = 1.500.'},
{t:'Bài 1 · Trả lời ngắn',q:'Một phân tử DNA tái bản liên tiếp 4 lần tạo ra bao nhiêu phân tử DNA con?',type:'short',a:['16'],e:'Số DNA con = 2⁴ = 16.'},
{t:'Bài 2 · Trả lời ngắn',q:'Một gene có tổng cộng 2.400 nucleotide trên cả hai mạch. Gene có bao nhiêu cặp nucleotide?',type:'short',a:['1200','1.200'],e:'Mỗi cặp gồm 2 nucleotide, nên số cặp = 2.400 ÷ 2 = 1.200.'},
{t:'Bài 2 · Trả lời ngắn',q:'Mạch khuôn DNA: 3′–TAC CTT AAA–5′. Viết trình tự mRNA theo chiều 5′ → 3′.',type:'short',a:['AUG GAA UUU','AUGGAAUUU','5′-AUG GAA UUU-3′','5′ AUG GAA UUU 3′'],e:'mRNA bổ sung với mạch khuôn và tổng hợp theo chiều 5′ → 3′: 5′–AUG GAA UUU–3′.'},
{t:'Bài 2 · Trả lời ngắn',q:'mRNA có 15 codon mã hóa amino acid, không tính codon kết thúc. Chuỗi polypeptide ban đầu có bao nhiêu amino acid?',type:'short',a:['15'],e:'Mỗi codon mã hóa tương ứng một amino acid; có 15 codon mã hóa thì chuỗi ban đầu có 15 amino acid.'},
{t:'Bài 3 · Trả lời ngắn',q:'Trong operon lac, protein nào gắn vùng vận hành khi không có lactose?',type:'short',a:['protein ức chế','chất ức chế','repressor','protein ức chế lac'],e:'Protein ức chế (repressor) gắn vùng vận hành và cản trở phiên mã.'},
{t:'Bài 3 · Trả lời ngắn',q:'Chất cảm ứng tự nhiên thường được nhắc đến trong mô hình operon lac là gì?',type:'short',a:['allolactose','allo-lactose'],e:'Allolactose là chất cảm ứng gắn vào protein ức chế; trong nhiều mô tả phổ thông, lactose được gọi khái quát là chất cảm ứng.'},
{t:'Bài 4 · Trả lời ngắn',q:'Gene có 1.200 cặp nucleotide. Sau khi mất một cặp nucleotide, gene còn bao nhiêu cặp?',type:'short',a:['1199','1.199'],e:'1.200 − 1 = 1.199 cặp nucleotide.'},
{t:'Bài 4 · Trả lời ngắn',q:'Thêm một nucleotide trong vùng mã hóa thường gây ra biến đổi nào trong cách đọc mã di truyền?',type:'short',a:['dịch khung','đột biến dịch khung','lệch khung đọc','dịch chuyển khung đọc'],e:'Thêm một nucleotide làm thay đổi cách phân chia các bộ ba từ vị trí đột biến trở đi, gọi là dịch khung đọc.'},
{t:'Bài 7 · Trả lời ngắn',q:'Loài có 2n = 16. Một tế bào sinh dưỡng ở kì giữa nguyên phân có bao nhiêu chromatid?',type:'short',a:['32'],e:'Có 16 NST kép, mỗi NST kép gồm 2 chromatid: 16 × 2 = 32.'},
{t:'Bài 7 · Trả lời ngắn',q:'DNA quấn quanh lõi gồm protein nào để hình thành nucleosome?',type:'short',a:['histone','protein histone','các protein histone'],e:'DNA quấn quanh lõi gồm các protein histone tạo nucleosome.'}
];
// Correct the first short-answer key to 900 (A=T=600; G=C=900).
cards[28].a=['900'];
let idx=0, score=0, answered=false, results=[];
const $=id=>document.getElementById(id);
function render(){answered=false;const c=cards[idx];$('count').textContent=`Thẻ ${idx+1}/${cards.length}`;$('score').textContent=`Điểm: ${score}`;$('type').textContent=c.type==='mc'?'4 lựa chọn':c.type==='tf'?'Đúng / Sai':'Trả lời ngắn';$('bar').style.width=`${idx/cards.length*100}%`;$('topic').textContent=c.t;$('question').textContent=c.q;$('choices').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;
if(c.type==='mc'){c.o.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>chooseMC(i,b);$('choices').appendChild(b)})}
else if(c.type==='tf'){c.s.forEach((st,i)=>{let row=document.createElement('div');row.className='tfrow';let p=document.createElement('div');p.className='tfstatement';p.textContent=String.fromCharCode(97+i)+') '+st;let bs=document.createElement('div');bs.className='tfbuttons';['Đúng','Sai'].forEach((lab,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=lab;b.dataset.val=j===0?'true':'false';b.onclick=()=>{if(answered)return;bs.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add('selected');b.style.borderColor='var(--site-primary)';row.dataset.answer=b.dataset.val};bs.appendChild(b)});row.append(p,bs);$('choices').appendChild(row)});let b=document.createElement('button');b.className='btn primary';b.style.marginTop='14px';b.textContent='Kiểm tra câu này';b.onclick=checkTF;$('choices').appendChild(b)}
else{let input=document.createElement('input');input.id='shortInput';input.className='input';input.placeholder='Nhập đáp án của bà…';input.autocomplete='off';let b=document.createElement('button');b.className='btn primary';b.style.marginTop='12px';b.textContent='Kiểm tra đáp án';b.onclick=checkShort;$('choices').append(input,b);input.addEventListener('keydown',e=>{if(e.key==='Enter')checkShort()})}
$('quiz').classList.remove('hidden');$('result').classList.add('hidden');}
function feedback(ok,msg){let f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✅ Chính xác!':'❌ Chưa đúng rồi!'}</strong><br>${msg}`;$('next').disabled=false;$('next').textContent=idx===cards.length-1?'Xem kết quả →':'Câu tiếp theo →';$('score').textContent=`Điểm: ${score}`}
function chooseMC(i,btn){if(answered)return;answered=true;let c=cards[idx];[...$('choices').querySelectorAll('button.choice')].forEach((b,j)=>{b.disabled=true;if(j===c.a)b.classList.add('correct');if(j===i&&i!==c.a)b.classList.add('wrong')});let ok=i===c.a;if(ok)score++;results[idx]=ok;feedback(ok,c.e)}
function checkTF(){if(answered)return;let c=cards[idx],rows=[...$('choices').querySelectorAll('.tfrow')];if(rows.some(r=>!r.dataset.answer)){alert('Bà chọn Đúng hoặc Sai cho cả 4 ý nha!');return}answered=true;let n=0;rows.forEach((r,i)=>{let ok=r.dataset.answer===String(c.a[i]);if(ok)n++;r.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.val===String(c.a[i]))b.classList.add('correct');if(b.dataset.val===r.dataset.answer&&!ok)b.classList.add('wrong')})});let ok=n===4;score+=n/4;results[idx]=ok;feedback(ok,`${n}/4 ý đúng. ${c.e}`)}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function checkShort(){if(answered)return;let c=cards[idx],v=$('shortInput').value.trim();if(!v){alert('Bà nhập đáp án trước nha!');return}answered=true;let ok=c.a.some(a=>norm(a)===norm(v));if(ok)score++;results[idx]=ok;$('shortInput').disabled=true;$('choices').querySelector('button').disabled=true;feedback(ok,`${c.e}<br><span class="small">Đáp án tham khảo: ${c.a[0]}</span>`)}
$('next').onclick=()=>{if(!answered)return;idx++;if(idx>=cards.length){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('finalscore').textContent=`${Math.round(score*100)/100} / 40`;let full=results.filter(Boolean).length;$('summary').textContent=`Bà trả lời đúng hoàn toàn ${full}/${cards.length} thẻ. Phần đúng/sai được tính theo số ý đúng.`}else render()};
function reset(){idx=0;score=0;results=[];render()}$('restart').onclick=reset;$('again').onclick=reset;render();
</script></body></html>
