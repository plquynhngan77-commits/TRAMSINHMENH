<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Flashcard Sinh học 12</title><style>

nter;margin-top:18px}@media(prefers-color-scheme:dark){:root{--bg:#101827;--card:#1b2638;--ink:#edf2ff;--muted:#a7b4ca;--line:#34445e}.tag{background:#283c72;color:#dbe5ff}.good{background:#173b2c!important;color:#a7f3c2!important}.bad{background:#4b2a20!important;color:#fed7aa!important}}
</style></head><body><main class="app"><header class="top"><h1>🧬 100 Flashcard Sinh học 12</h1><p>Lý thuyết bài 1, 2, 3, 4, 7 · Kết nối tri thức</p></header><div class="toolbar"><select id="section" aria-label="Chọn bài"><option value="all">Tất cả các bài (100)</option></select><button id="shuffle">🔀 Trộn thẻ</button><button id="reset">↺ Làm lại</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="meta"><span id="counter">Thẻ 1/100</span><span id="known">Đã thuộc: 0</span></div><section class="flash" id="flash" role="button" tabindex="0" aria-label="Lật flashcard"><span class="tag" id="tag"></span><div class="label" id="label">CÂU HỎI</div><div class="content" id="content"></div><div class="hint" id="hint">Chạm vào thẻ hoặc nhấn “Lật thẻ” để xem đáp án</div></section><div class="controls"><button id="prev">← Trước</button><button class="primary" id="flip">Lật thẻ ↻</button><button id="next">Tiếp →</button></div><div class="controls" id="rating" hidden><button class="bad" id="again">↻ Cần ôn lại</button><button class="good" id="learned">✓ Đã thuộc</button></div><div class="stats" id="stats">Chưa đánh dấu thẻ nào.</div><p class="small">Mẹo: tự trả lời trước khi lật thẻ nhé! Các đáp án được tóm tắt để ôn nhanh.</p></main><script>
const allCards=[{"q": "Đơn phân cấu tạo nên DNA là gì?", "a": "Nucleotide.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Một nucleotide DNA gồm những thành phần nào?", "a": "Đường deoxyribose, nhóm phosphate và một base nitơ.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "DNA có những loại base nitơ nào?", "a": "Adenine (A), thymine (T), guanine (G), cytosine (C).", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Nguyên tắc bổ sung trong DNA là gì?", "a": "A liên kết với T; G liên kết với C.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Trong DNA mạch kép, vì sao A = T và G = C?", "a": "Do các base bắt cặp bổ sung theo nguyên tắc A–T và G–C.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "DNA có cấu trúc không gian cơ bản như thế nào?", "a": "Hai mạch polynucleotide xoắn kép, ngược chiều nhau.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Liên kết nối các nucleotide trên cùng một mạch DNA là gì?", "a": "Liên kết phosphodiester.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Các base bổ sung được giữ với nhau bằng liên kết gì?", "a": "Liên kết hydrogen.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Tái bản DNA là gì?", "a": "Quá trình tạo ra các phân tử DNA mới từ DNA khuôn.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Tái bản DNA diễn ra theo nguyên tắc nào?", "a": "Nguyên tắc bổ sung và bán bảo toàn.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Bán bảo toàn trong tái bản DNA nghĩa là gì?", "a": "Mỗi DNA con gồm một mạch cũ của DNA mẹ và một mạch mới tổng hợp.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Enzyme tháo xoắn DNA có vai trò gì?", "a": "Tách hai mạch DNA bằng cách phá vỡ liên kết hydrogen.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "DNA polymerase làm nhiệm vụ gì?", "a": "Gắn các nucleotide để tổng hợp mạch DNA mới theo chiều 5’→3’.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Vì sao mạch dẫn đầu được tổng hợp liên tục?", "a": "Vì chiều khuôn phù hợp với chiều tổng hợp 5’→3’ theo hướng chạc tái bản.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Mạch theo sau được tổng hợp như thế nào?", "a": "Từng đoạn ngắn Okazaki, sau đó được nối lại.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Đoạn Okazaki là gì?", "a": "Đoạn DNA ngắn được tổng hợp gián đoạn trên mạch theo sau.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Enzyme nào nối các đoạn Okazaki?", "a": "DNA ligase.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Đoạn mồi có vai trò gì?", "a": "Cung cấp đầu 3’-OH để DNA polymerase bắt đầu kéo dài mạch mới.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Vì sao tái bản DNA có độ chính xác cao?", "a": "Nhờ bắt cặp bổ sung và cơ chế kiểm tra, sửa sai của enzyme.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Ý nghĩa của tái bản DNA là gì?", "a": "Bảo đảm thông tin di truyền được truyền tương đối chính xác qua các lần phân bào.", "section": "BÀI 1 · DNA VÀ TÁI BẢN DNA"}, {"q": "Gene là gì?", "a": "Một đoạn DNA mang thông tin mã hóa sản phẩm xác định, thường là RNA hoặc chuỗi polypeptide.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Gene cấu trúc thường gồm những vùng nào?", "a": "Vùng điều hòa, vùng mã hóa và vùng kết thúc.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Vùng điều hòa của gene có chức năng gì?", "a": "Điều khiển sự khởi đầu và mức độ phiên mã.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Vùng mã hóa chứa thông tin gì?", "a": "Thông tin quy định trình tự RNA hoặc amino acid của sản phẩm gene.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Gene ở sinh vật nhân sơ thường có đặc điểm gì về vùng mã hóa?", "a": "Thường liên tục, ít hoặc không có intron.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Gene ở sinh vật nhân thực thường có đặc điểm gì?", "a": "Nhiều gene có exon xen kẽ intron.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Phiên mã là gì?", "a": "Tổng hợp RNA dựa trên mạch khuôn DNA.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Enzyme chủ yếu xúc tác phiên mã là gì?", "a": "RNA polymerase.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "RNA polymerase đọc mạch khuôn theo chiều nào?", "a": "Theo chiều 3’→5’ để tổng hợp RNA theo chiều 5’→3’.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Ba loại RNA chính tham gia biểu hiện gene là gì?", "a": "mRNA, tRNA và rRNA.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "mRNA có chức năng gì?", "a": "Mang thông tin mã hóa từ DNA đến ribosome.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "tRNA có chức năng gì?", "a": "Vận chuyển amino acid và nhận biết codon bằng anticodon.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "rRNA có chức năng gì?", "a": "Là thành phần cấu tạo ribosome và tham gia xúc tác hình thành liên kết peptide.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Dịch mã là gì?", "a": "Quá trình ribosome sử dụng thông tin trên mRNA để tổng hợp chuỗi polypeptide.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Codon là gì?", "a": "Bộ ba nucleotide liên tiếp trên mRNA quy định amino acid hoặc tín hiệu kết thúc.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Codon mở đầu phổ biến là gì?", "a": "AUG, thường mã hóa methionine.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Ba codon kết thúc là gì?", "a": "UAA, UAG và UGA.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Ribosome có vai trò gì trong dịch mã?", "a": "Đọc codon mRNA và xúc tác nối các amino acid thành chuỗi polypeptide.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Thông tin di truyền được truyền đạt từ gene đến protein theo sơ đồ nào?", "a": "DNA → RNA → protein.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Mã di truyền có tính thoái hóa nghĩa là gì?", "a": "Nhiều codon khác nhau có thể cùng mã hóa một amino acid.", "section": "BÀI 2 · GENE VÀ TRUYỀN ĐẠT THÔNG TIN"}, {"q": "Điều hòa biểu hiện gene là gì?", "a": "Kiểm soát thời điểm, vị trí và mức độ gene được biểu hiện.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Vì sao tế bào cần điều hòa biểu hiện gene?", "a": "Để tiết kiệm năng lượng, thích nghi môi trường và chuyên hóa chức năng.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Biểu hiện gene thường gồm hai quá trình chính nào?", "a": "Phiên mã và dịch mã; ở sinh vật nhân thực còn có xử lí RNA.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Điều hòa biểu hiện gene có thể diễn ra ở những mức nào?", "a": "Trước phiên mã, trong phiên mã, sau phiên mã, trong dịch mã và sau dịch mã.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Operon là gì?", "a": "Nhóm gene cấu trúc ở sinh vật nhân sơ được điều hòa chung bởi các yếu tố điều hòa.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Operon lac có chức năng liên quan đến chất nào?", "a": "Chuyển hóa lactose ở vi khuẩn E. coli.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Các thành phần chính của operon lac gồm gì?", "a": "Vùng khởi động P, vùng vận hành O và các gene cấu trúc lacZ, lacY, lacA; gene điều hòa lacI nằm ngoài operon.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Protein ức chế lac do gene nào mã hóa?", "a": "Gene điều hòa lacI.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Khi không có lactose, operon lac thường ở trạng thái nào?", "a": "Protein ức chế gắn vùng vận hành, cản trở phiên mã các gene cấu trúc.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Khi có lactose, điều gì xảy ra với protein ức chế?", "a": "Chất cảm ứng (allolactose) gắn vào protein ức chế, làm nó khó gắn vùng vận hành.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Khi protein ức chế rời vùng vận hành, điều gì có thể xảy ra?", "a": "RNA polymerase có thể phiên mã các gene cấu trúc của operon lac.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Chất cảm ứng của operon lac là gì?", "a": "Allolactose, chất chuyển hóa từ lactose.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Điều hòa dương tính của operon lac liên quan đến yếu tố nào?", "a": "Phức hợp CAP–cAMP giúp tăng phiên mã khi glucose thấp.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Khi glucose thấp, nồng độ cAMP thường thay đổi thế nào?", "a": "Tăng, hỗ trợ CAP hoạt hóa phiên mã operon lac.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Tế bào có thể điều hòa gene để thích nghi môi trường bằng cách nào?", "a": "Bật hoặc tắt gene, hoặc thay đổi mức độ biểu hiện phù hợp điều kiện.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Ở sinh vật nhân thực, cấu trúc chromatin ảnh hưởng gene ra sao?", "a": "Chromatin đóng chặt thường làm gene khó được phiên mã; chromatin mở thuận lợi hơn.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Yếu tố phiên mã là gì?", "a": "Protein nhận biết trình tự DNA và điều hòa quá trình phiên mã.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Điều hòa sau phiên mã có thể diễn ra bằng cách nào?", "a": "Xử lí RNA, cắt nối thay thế, vận chuyển hoặc phân hủy mRNA.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Điều hòa sau dịch mã có thể gồm những gì?", "a": "Biến đổi, hoạt hóa, định vị hoặc phân hủy protein.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Ý nghĩa của điều hòa gene trong phát triển cơ thể là gì?", "a": "Giúp các tế bào có cùng bộ gene biểu hiện gene khác nhau và đảm nhận chức năng riêng.", "section": "BÀI 3 · ĐIỀU HÒA BIỂU HIỆN GENE"}, {"q": "Đột biến gene là gì?", "a": "Sự biến đổi trong trình tự nucleotide của gene.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến điểm là gì?", "a": "Biến đổi liên quan đến một hoặc một vài cặp nucleotide tại một vị trí gene.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Ba dạng đột biến điểm thường gặp là gì?", "a": "Thay thế, thêm hoặc mất một cặp nucleotide.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Thay thế một cặp nucleotide có thể gây hậu quả nào?", "a": "Có thể không đổi amino acid, đổi một amino acid hoặc tạo codon kết thúc.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Thêm hoặc mất nucleotide không theo bội số của 3 thường gây gì?", "a": "Dịch khung đọc từ vị trí đột biến, làm thay đổi nhiều codon phía sau.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến đồng nghĩa là gì?", "a": "Đột biến làm đổi codon nhưng không đổi amino acid được mã hóa.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến sai nghĩa là gì?", "a": "Đột biến làm codon mã hóa amino acid khác.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến vô nghĩa là gì?", "a": "Đột biến tạo codon kết thúc sớm.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Nguyên nhân gây đột biến gene gồm những gì?", "a": "Sai sót tự phát khi nhân đôi DNA hoặc tác động của tác nhân vật lí, hóa học, sinh học.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Tác nhân đột biến là gì?", "a": "Yếu tố làm tăng khả năng phát sinh đột biến.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến gene có luôn có hại không?", "a": "Không; có thể có hại, trung tính hoặc có lợi tùy gene, môi trường và bối cảnh.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến gene có thể di truyền khi nào?", "a": "Khi xảy ra ở dòng tế bào tạo giao tử hoặc tế bào sinh sản và được truyền cho thế hệ sau.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến ở tế bào soma thường ảnh hưởng thế nào?", "a": "Ảnh hưởng cá thể; thường không truyền cho đời sau qua sinh sản hữu tính.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Vì sao đột biến gene là nguồn nguyên liệu tiến hóa?", "a": "Chúng tạo allele mới, làm tăng biến dị di truyền trong quần thể.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến có thể ảnh hưởng protein bằng cách nào?", "a": "Thay đổi trình tự amino acid, độ dài hoặc lượng protein; đôi khi không ảnh hưởng rõ.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến phát sinh trong quá trình nào thường gặp?", "a": "Trong nhân đôi DNA, nhưng cũng có thể do tổn thương DNA và sửa chữa sai.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến tự phát là gì?", "a": "Đột biến xuất hiện tự nhiên không cần tác nhân gây đột biến bên ngoài.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Đột biến cảm ứng là gì?", "a": "Đột biến phát sinh với tần số tăng do tác động của tác nhân gây đột biến.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Có thể loại bỏ hoàn toàn mọi đột biến không?", "a": "Không; có thể giảm tiếp xúc tác nhân nguy hại nhưng không loại bỏ hoàn toàn đột biến tự nhiên.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Vai trò của đột biến trong chọn giống là gì?", "a": "Tạo biến dị di truyền để chọn lọc những đặc điểm có ích.", "section": "BÀI 4 · ĐỘT BIẾN GENE"}, {"q": "Nhiễm sắc thể là gì?", "a": "Cấu trúc gồm DNA liên kết với protein, mang gene và thông tin di truyền.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Thành phần chủ yếu của nhiễm sắc thể ở sinh vật nhân thực là gì?", "a": "DNA và protein, chủ yếu là histone.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Chromatin là gì?", "a": "Phức hợp DNA và protein tạo nên vật chất nhiễm sắc trong nhân.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Nucleosome là gì?", "a": "Đơn vị cơ bản của chromatin, gồm DNA quấn quanh lõi protein histone.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Vai trò của histone là gì?", "a": "Giúp đóng gói DNA và góp phần điều hòa hoạt động gene.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Vì sao DNA cần được đóng gói thành nhiễm sắc thể?", "a": "Để bảo vệ, sắp xếp gọn DNA và hỗ trợ phân chia chính xác.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Nhiễm sắc thể kép gồm mấy chromatid?", "a": "Hai chromatid chị em gắn nhau tại vùng tâm động.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Nhiễm sắc thể đơn gồm mấy chromatid?", "a": "Một chromatid.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Tâm động có vai trò gì?", "a": "Là vùng hình thành kinetochore, giúp nhiễm sắc thể gắn với thoi phân bào.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Đầu mút nhiễm sắc thể có chức năng gì?", "a": "Bảo vệ đầu nhiễm sắc thể và hạn chế mất hoặc dính các đầu DNA.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Telomere là gì?", "a": "Trình tự DNA lặp lại cùng protein ở đầu mút nhiễm sắc thể của nhiều sinh vật nhân thực.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Bộ nhiễm sắc thể lưỡng bội kí hiệu thế nào?", "a": "2n.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Bộ nhiễm sắc thể đơn bội kí hiệu thế nào?", "a": "n.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Tế bào sinh dưỡng của người bình thường có bao nhiêu nhiễm sắc thể?", "a": "46 nhiễm sắc thể, tức 23 cặp.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Giao tử người bình thường có bao nhiêu nhiễm sắc thể?", "a": "23 nhiễm sắc thể.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Nhiễm sắc thể tương đồng là gì?", "a": "Một cặp gồm một chiếc có nguồn gốc từ bố và một từ mẹ, mang các gene tương ứng ở cùng locus.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Nhiễm sắc thể thường khác nhiễm sắc thể giới tính thế nào?", "a": "Nhiễm sắc thể thường không trực tiếp quyết định giới tính; nhiễm sắc thể giới tính tham gia xác định giới tính theo hệ của loài.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Đột biến cấu trúc nhiễm sắc thể gồm những dạng nào?", "a": "Mất đoạn, lặp đoạn, đảo đoạn và chuyển đoạn.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Đột biến số lượng nhiễm sắc thể gồm những dạng nào?", "a": "Lệch bội và đa bội.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}, {"q": "Vì sao đột biến nhiễm sắc thể có thể gây hậu quả lớn?", "a": "Có thể làm thay đổi nhiều gene hoặc liều lượng gene cùng lúc.", "section": "BÀI 7 · NHIỄM SẮC THỂ"}];let cards=[...allCards],pos=0,flipped=false,known=new Set(),review=new Set();const $=id=>document.getElementById(id);const sectionNames=[...new Set(allCards.map(c=>c.section))];sectionNames.forEach((s,i)=>{let o=document.createElement('option');o.value=s;o.textContent=s+' (20)';$('section').appendChild(o)});
function render(){if(!cards.length)return;$('counter').textContent=`Thẻ ${pos+1}/${cards.length}`;$('known').textContent=`Đã thuộc: ${known.size}`;$('bar').style.width=((pos+1)/cards.length*100)+'%';$('tag').textContent=cards[pos].section;$('label').textContent=flipped?'ĐÁP ÁN':'CÂU HỎI';$('content').textContent=flipped?cards[pos].a:cards[pos].q;$('hint').textContent=flipped?'Hãy tự giải thích lại bằng lời của mình.':'Chạm vào thẻ hoặc nhấn “Lật thẻ” để xem đáp án';$('rating').hidden=!flipped;$('stats').textContent=`Đã thuộc: ${known.size} · Cần ôn lại: ${review.size}`;}
function flip(){flipped=!flipped;render()}function move(n){pos=(pos+n+cards.length)%cards.length;flipped=false;render()}$('flash').onclick=flip;$('flash').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('learned').onclick=()=>{known.add(cards[pos].q);review.delete(cards[pos].q);move(1)};$('again').onclick=()=>{review.add(cards[pos].q);known.delete(cards[pos].q);move(1)};$('section').onchange=()=>{let v=$('section').value;cards=v==='all'?[...allCards]:allCards.filter(c=>c.section===v);pos=0;flipped=false;render()};$('shuffle').onclick=()=>{for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}pos=0;flipped=false;render()};$('reset').onclick=()=>{cards=$('section').value==='all'?[...allCards]:allCards.filter(c=>c.section===$('section').value);pos=0;flipped=false;known.clear();review.clear();render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SELECT'){e.preventDefault();flip()}});render();
</script></body></html>
